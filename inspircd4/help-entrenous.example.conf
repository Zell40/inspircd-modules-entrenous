# Help topics for Entre Nous InspIRCd modules (inspircd-modules-entrenous).
# Include from your main help file, e.g.:
#   <include file="help-entrenous.conf">
# after copying this file next to help.conf / help.example.conf.
#
# Also add the command names to your /HELP CUSER (and COPER) index lists.

# ---------------------------------------------------------------------------
# Account registration (m_account_registration)
# ---------------------------------------------------------------------------

<helptopic key="register" title="/REGISTER <account|*> <email|*> <password>" value="
IRCv3 draft/account-registration (module account_registration).

Register a new account during or after connection registration.
Requires CAP REQ draft/account-registration.

The ircd forwards the request to services (ENCAP ACCREG). Without a
compatible services module, REGISTER fails with TEMPORARILY_UNAVAILABLE.

See also: VERIFY, CAP, SASL.
">

<helptopic key="verify" title="/VERIFY <account> <code>" value="
IRCv3 draft/account-registration (module account_registration).

Confirm account registration with the verification code from services.
Requires CAP REQ draft/account-registration.
">

# ---------------------------------------------------------------------------
# Web Push (m_ircv3_webpush)
# ---------------------------------------------------------------------------

<helptopic key="webpush" title="/WEBPUSH REGISTER|UNREGISTER …" value="
IRCv3 soju.im/webpush / draft/webpush (module ircv3_webpush).

REGISTER <endpoint> <keys>  - Subscribe a browser push endpoint (p256dh/auth).
UNREGISTER <endpoint>       - Remove a subscription.

Requires CAP REQ soju.im/webpush (or draft/webpush). Used by clients such as
Goguma for offline/away notifications.
">

# ---------------------------------------------------------------------------
# Metadata (m_ircv3_metadata)
# ---------------------------------------------------------------------------

<helptopic key="metadata" title="/METADATA <target> <subcommand> …" value="
IRCv3 draft/metadata-2 and draft/metadata-3 (module ircv3_metadata).

Subcommands:
  GET <key…>           - Fetch keys on a nick or channel
  SET <key> [:<value>] - Set or clear a key on yourself (*) or a channel
  LIST                 - List set keys
  CLEAR                - Clear all keys on the target
  SUB <key…>           - Subscribe to live updates (Orbit: avatar bio …)
  UNSUB <key…>         - Unsubscribe
  SUBS                 - List subscriptions
  SYNC                 - Resync subscribed keys for a target

Requires CAP REQ draft/metadata-2 (Orbit) or draft/metadata-3.
Default allowkeys: avatar bio pronouns timezone url.
">

# ---------------------------------------------------------------------------
# Chat history (m_ircv3_chathistory)
# ---------------------------------------------------------------------------

<helptopic key="chathistory" title="/CHATHISTORY <subcommand> …" value="
IRCv3 draft/chathistory (+ draft/event-playback) (module ircv3_chathistory).

Query history (requires CAP REQ draft/chathistory):
  LATEST <target> *|<timestamp=…>|<msgid=…> <limit>
  BEFORE <target> <timestamp=…>|<msgid=…> <limit>
  AFTER / AROUND / BETWEEN  - also supported

Orbit uses LATEST on JOIN and BEFORE when scrolling. Replies are a
chathistory BATCH (needs ircv3_batch). With draft/event-playback, JOIN/PART
and similar events are included.

Clear history (does NOT require the CAP):
  CHATHISTORY CLEAR <#channel>
  CHATHISTORY CLEAR <nick>

Channel clear: need channel rank >= clearminrank (default op), or IRCop
privilege channels/clear-chathistory.

PM clear (participant): conversation with that nick if allowselfpmclear=yes
(shared server buffer — both sides lose history).

PM clear (IRCop users/clear-chathistory): ALL PM buffers involving that nick
(online or offline).

History is stored in memory only (lost on restart). Distinct from mode +H.
">

<helptopic key="chathistory-clear" title="/CHATHISTORY CLEAR <channel|nick>" value="
Clear stored IRCv3 chat history for a channel or private conversation
(module ircv3_chathistory).

Channel: clearminrank or channels/clear-chathistory.
PM (self): allowselfpmclear. PM (oper): users/clear-chathistory clears
every conversation involving the nick.
">

# ---------------------------------------------------------------------------
# Read marker (m_ircv3_read_marker)
# ---------------------------------------------------------------------------

<helptopic key="markread" title="/MARKREAD <target> [timestamp=<ISO>]" value="
IRCv3 draft/read-marker (module ircv3_read_marker).

Set:   MARKREAD #channel timestamp=2019-01-04T14:33:26.123Z
Get:   MARKREAD #channel
       MARKREAD SomeNick

Requires CAP REQ draft/read-marker. Used by Orbit to sync the read
position across sessions of the same account. Timestamps only move forward.
After JOIN, the server sends the current marker for that channel.

With requireaccount=yes the cap is only advertised to logged-in users
(SASL); cap-notify sends CAP NEW after authentication.
">
