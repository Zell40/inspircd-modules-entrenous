# Sujets d'aide pour les modules InspIRCd Entre Nous (inspircd-modules-entrenous).
# À inclure depuis ton fichier help principal, par ex. :
#   <include file="help-entrenous.conf">
# après avoir copié ce fichier à côté de help.conf / help.example.conf.
#
# Ajoute aussi les noms de commandes dans les index /HELP CUSER (et COPER).

# ---------------------------------------------------------------------------
# Enregistrement de compte (m_account_registration)
# ---------------------------------------------------------------------------

<helptopic key="register" title="/REGISTER <compte|*> <email|*> <mot de passe>" value="
IRCv3 draft/account-registration (module account_registration).

Crée un nouveau compte pendant ou après l'enregistrement de la connexion.
Nécessite CAP REQ draft/account-registration.

L'ircd transmet la demande aux services (ENCAP ACCREG). Sans module services
compatible, REGISTER échoue avec TEMPORARILY_UNAVAILABLE.

Voir aussi : VERIFY, CAP, SASL.
">

<helptopic key="verify" title="/VERIFY <compte> <code>" value="
IRCv3 draft/account-registration (module account_registration).

Confirme l'enregistrement du compte avec le code de vérification des services.
Nécessite CAP REQ draft/account-registration.
">

# ---------------------------------------------------------------------------
# Web Push (m_ircv3_webpush)
# ---------------------------------------------------------------------------

<helptopic key="webpush" title="/WEBPUSH REGISTER|UNREGISTER …" value="
IRCv3 soju.im/webpush / draft/webpush (module ircv3_webpush).

REGISTER <endpoint> <keys>  - Abonne un endpoint push navigateur (p256dh/auth).
UNREGISTER <endpoint>       - Supprime un abonnement.

Nécessite CAP REQ soju.im/webpush (ou draft/webpush). Utilisé par des clients
comme Goguma pour les notifications hors ligne / away.
">

# ---------------------------------------------------------------------------
# Métadonnées (m_ircv3_metadata)
# ---------------------------------------------------------------------------

<helptopic key="metadata" title="/METADATA <cible> <sous-commande> …" value="
IRCv3 draft/metadata-2 et draft/metadata-3 (module ircv3_metadata).

Sous-commandes :
  GET <clé…>           - Récupère des clés sur un nick ou un canal
  SET <clé> [:<valeur>] - Définit ou efface une clé sur soi (*) ou un canal
  LIST                 - Liste les clés définies
  CLEAR                - Efface toutes les clés de la cible
  SUB <clé…>           - S'abonne aux mises à jour live (Orbit : avatar bio …)
  UNSUB <clé…>         - Se désabonne
  SUBS                 - Liste les abonnements
  SYNC                 - Resynchronise les clés abonnées pour une cible

Nécessite CAP REQ draft/metadata-2 (Orbit) ou draft/metadata-3.
allowkeys par défaut : avatar bio pronouns timezone url.
">

# ---------------------------------------------------------------------------
# Historique de chat (m_ircv3_chathistory)
# ---------------------------------------------------------------------------

<helptopic key="chathistory" title="/CHATHISTORY <sous-commande> …" value="
IRCv3 draft/chathistory (+ draft/event-playback) (module ircv3_chathistory).

Interroger l'historique (nécessite CAP REQ draft/chathistory) :
  LATEST <cible> *|<timestamp=…>|<msgid=…> <limite>
  BEFORE <cible> <timestamp=…>|<msgid=…> <limite>
  AFTER / AROUND / BETWEEN  - également pris en charge

Orbit utilise LATEST au JOIN et BEFORE au défilement. Les réponses sont dans
un BATCH chathistory (nécessite ircv3_batch). Avec draft/event-playback,
les JOIN/PART et événements similaires sont inclus.

Purger l'historique (ne nécessite PAS la CAP) :
  CHATHISTORY CLEAR <#canal>
  CHATHISTORY CLEAR <nick>

Canal : rang >= clearminrank (défaut op), ou privilège IRCop
channels/clear-chathistory.

MP (participant) : conversation avec ce nick si allowselfpmclear=yes
(tampon serveur partagé — les deux côtés perdent l'historique).

MP (IRCop users/clear-chathistory) : TOUS les tampons MP impliquant ce nick
(en ligne ou hors ligne).

L'historique est stocké en mémoire uniquement (perdu au redémarrage).
Distinct du mode +H.
">

<helptopic key="chathistory-clear" title="/CHATHISTORY CLEAR <canal|nick>" value="
Efface l'historique IRCv3 stocké pour un canal ou une conversation privée
(module ircv3_chathistory).

Canal : clearminrank ou channels/clear-chathistory.
MP (soi) : allowselfpmclear. MP (oper) : users/clear-chathistory efface
toutes les conversations impliquant le nick.
">

# ---------------------------------------------------------------------------
# Marqueur de lecture (m_ircv3_read_marker)
# ---------------------------------------------------------------------------

<helptopic key="markread" title="/MARKREAD <cible> [timestamp=<ISO>]" value="
IRCv3 draft/read-marker (module ircv3_read_marker).

Définir : MARKREAD #canal timestamp=2019-01-04T14:33:26.123Z
Lire :    MARKREAD #canal
          MARKREAD UnNick

Nécessite CAP REQ draft/read-marker. Utilisé par Orbit pour synchroniser la
position de lecture entre les sessions du même compte. Les horodatages ne
reculent jamais. Après un JOIN, le serveur envoie le marqueur courant du canal.

Avec requireaccount=yes, la cap n'est annoncée qu'aux utilisateurs identifiés
(SASL) ; cap-notify envoie CAP NEW après l'authentification.
">

# ---------------------------------------------------------------------------
# Multiligne (m_ircv3_multiline)
# ---------------------------------------------------------------------------

<helptopic key="multiline" title="BATCH draft/multiline (client)" value="
IRCv3 draft/multiline (module ircv3_multiline).

Permet d'envoyer un message multi-lignes dans un batch client :

  BATCH +<ref> draft/multiline <#canal|nick>
  @batch=<ref> PRIVMSG <cible> :ligne 1
  @batch=<ref> PRIVMSG <cible> :ligne 2
  BATCH -<ref>

Le tag draft/multiline-concat joint une ligne à la précédente (coupure 512).

Nécessite CAP REQ draft/multiline et batch. Valeurs annoncées :
max-bytes et max-lines (défaut 40000 / 20).

Les clients sans la cap reçoivent plusieurs PRIVMSG (fallback).
">
