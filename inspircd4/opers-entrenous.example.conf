# Oper privilege snippet for Entre Nous IRCv3 modules.
# Merge the privs= strings into your existing <class> blocks in opers.conf.
#
# --- Chat history clear (m_ircv3_chathistory) ---
#
# channels/clear-chathistory
#   IRCop may CHATHISTORY CLEAR any channel without channel rank / membership.
#   Suggested for: NetAdmin, GlobalOp (not for helpdesk-only classes).
#
# users/clear-chathistory
#   IRCop may CHATHISTORY CLEAR <nick>: wipes ALL private-history buffers
#   involving that nick (online or offline). More sensitive than channel clear.
#   Suggested for: NetAdmin only, or senior staff.
#
# Example (add to an existing class privs= list):
#
# <class name="NetAdmin"
#     ...
#     privs="... channels/clear-chathistory users/clear-chathistory">
#
# <class name="GlobalOp"
#     ...
#     privs="... channels/clear-chathistory">
#
# Channel staff without these privs still use clearminrank (default op):
#   clearminrank="op" | "admin" | "founder" | "halfop" | numeric rank
#
# --- Read markers (m_ircv3_read_marker) ---
# No special oper priv; markers are per-account. Oper override not implemented.
#
# --- Metadata / webpush / account-registration ---
# No dedicated clear-history oper privs.
